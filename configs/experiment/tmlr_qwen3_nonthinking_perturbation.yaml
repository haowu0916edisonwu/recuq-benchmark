experiment:
  name: "tmlr_qwen3_nonthinking_perturbation"
  method: "qwen3_nonthinking_base_rank"
  model: "../model/qwen3-8b-nonthinking.yaml"
  datasets:
    - "../dataset/mind_20.yaml"
    - "../dataset/amazon_books.yaml"
    - "../dataset/amazon_movies.yaml"
    - "../dataset/yelp.yaml"
  scenarios:
    - "../condition/s0_warmstart.yaml"
    - "../condition/s3_sparsity.yaml"
    - "../condition/s5_robustness.yaml"
  subset_manifest: "../eval_subsets/aligned20_n1000_seed42.jsonl"
  evaluation:
    subset_size: 1000
    k: 10
    seed: 42
  cache_dir: "cache/tmlr/qwen3_8b_nonthinking/warm_start"
  results_dir: "results/qwen3_8b_nonthinking/perturbation_controls"
  reuse_equivalent_prompts: true
